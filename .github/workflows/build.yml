name: Build

# Сборка на каждый пуш в main и PR. Релиз: создай GitHub Release
# (Releases → Draft a new release → новый тег vX.Y.Z → Publish) —
# workflow соберёт подписанный APK и прикрепит его к релизу.
on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AMT_KEYSTORE_B64: ${{ secrets.AMT_KEYSTORE_B64 }}
      AMT_KEYSTORE_PASSWORD: ${{ secrets.AMT_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Ключ есть только в основном репозитории (секреты). В форках и PR
      # секретов нет — тогда сборка подписывается debug-ключом.
      - name: Restore signing key
        if: env.AMT_KEYSTORE_B64 != ''
        run: |
          echo "$AMT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "AMT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Refuse unsigned release
        if: github.event_name == 'release' && env.AMT_KEYSTORE_B64 == ''
        run: |
          echo "::error::Signing secrets are not set; refusing to publish a debug-signed release."
          exit 1

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/release/app-release.apk "AMTweaks-$VER.apk"
          echo "APK=AMTweaks-$VER.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: AMTweaks
          path: ${{ env.APK }}

      - name: Release notes
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          t="${TAG#v}"
          for f in "docs/release-notes/${TAG}.md" "docs/release-notes/v${t}.md" "docs/release-notes/${t}.md"; do
            if [ -f "$f" ]; then cp "$f" notes.md; break; fi
          done
          [ -f notes.md ] || echo "AM Tweaks ${TAG}" > notes.md

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: AM Tweaks ${{ github.event.release.tag_name }}
          body_path: notes.md
          files: ${{ env.APK }}
